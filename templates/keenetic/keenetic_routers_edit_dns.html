<section class="card">
	<div class="card-body">
		<form action="?" method="post" enctype="multipart/form-data" name="frmEdit">
			[#if OK#]
			<div class="alert alert-success"><#LANG_DATA_SAVED#></div>
			[#endif OK#]
			[#if ERR#]
			<div class="alert alert-danger">[#ERR_ALERT#]</div>
			[#endif ERR#]

			<div class="table-responsive">
				<table class="table table-striped align-middle">
					[#if DNS!=""#]
					<thead>
						<tr>
							<th>Доменное имя</th>
							<th>Адрес</th>
							<th class="text-end">&nbsp;</th>
						</tr>
					</thead>
					<tbody>
						[#begin DNS#]
						<tr>
							<td>[#TITLE#]</td>
							<td>[#IP#]</td>
							<td class="text-end">
								<a href="?id=<#ID#>&tab=<#TAB#>&view_mode=<#VIEW_MODE#>&delete_domain=[#TITLE#]" data-md-confirm="<#LANG_ARE_YOU_SURE#>" class="btn btn-outline-danger btn-sm"><#LANG_DELETE#></a>
							</td>
						</tr>
						[#end DNS#]
					</tbody>
					[#endif DNS#]
					<tfoot>
						<tr>
							<th colspan="3"><#LANG_ADD#></th>
						</tr>
						<tr>
							<td><input class="form-control" type="text" name="title_new" value="" placeholder="example.local"></td>
							<td><input class="form-control" type="text" name="ip_new" value="" placeholder="192.168.1.10"></td>
							<td class="text-end">&nbsp;</td>
						</tr>
					</tfoot>
				</table>
			</div>

			<div class="d-flex gap-2 mt-3">
				<button type="submit" name="subm" value="Submit" class="btn btn-primary"><#LANG_SUBMIT#></button>
				<a href="?data_source=<#DATA_SOURCE#>" class="btn btn-outline-secondary"><#LANG_CANCEL#></a>
			</div>

			<input type="hidden" name="id" value="<#ID#>">
			<input type="hidden" name="view_mode" value="<#VIEW_MODE#>">
			<input type="hidden" name="edit_mode" value="<#EDIT_MODE#>">
			<input type="hidden" name="mode" value="update">
			<input type="hidden" name="data_source" value="<#DATA_SOURCE#>">
			<input type="hidden" name="tab" value="<#TAB#>">
		</form>
	</div>
</section>
